# FlatLaf 浅色主题覆盖项 —— Windows 11 风格
# 强调色（默认按钮 / 选中态 / 进度条）
Component.accentColor=#0F6CBD
# 窗口底色（卡片之间的留白区域）
Panel.background=#F3F4F6
# 应用自定义键（Card 等自绘组件在绘制时读取，主题切换可即时换色）
App.background=#F3F4F6
App.card=#FFFFFF
App.cardBorder=#E4E7EC
App.headerText=#1A1D21
App.subText=#687078
# 终端卡片：浅/深主题下都保持深色控制台
App.consoleBg=#1B1F26
App.consoleBorder=#30363F
App.consoleFg=#D2D9E4
App.consoleSelection=#2D4F7A
